<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Stitch Malawi Foundation</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🌿</div>
      <h1>Admin Panel</h1>
      <p>Stitch Malawi Foundation</p>
    </div>

    <div id="expired-notice" style="display:none;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:12px 16px;margin-bottom:24px;font-size:0.85rem;color:var(--admin-gold)">
      ⚠️ Your session expired. Please log in again.
    </div>

    <form id="login-form">
      <div class="admin-form-group">
        <label class="admin-label" for="username">Username</label>
        <input class="admin-input" type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
      </div>
      <div class="admin-form-group">
        <label class="admin-label" for="password">Password</label>
        <input class="admin-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="login-error" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:0.85rem;color:var(--admin-red)"></div>

      <button type="submit" id="login-btn" class="btn-admin btn-primary-admin" style="width:100%;justify-content:center;padding:12px;font-size:1rem">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:32px;font-size:0.8rem;color:var(--admin-text-muted)">
      <a href="/" style="color:var(--admin-green)">← Return to Public Site</a>
    </p>
  </div>
</div>

<script src="/admin/js/admin.js"></script>
<script>
  // If already logged in, redirect
  if (getToken()) window.location.href = '/admin/dashboard.html';

  // Show expired notice
  if (new URLSearchParams(window.location.search).get('expired')) {
    document.getElementById('expired-notice').style.display = 'block';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Signing in…';
    errorEl.style.display = 'none';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('smf_admin_token', data.token);
        localStorage.setItem('smf_admin_username', data.username);
        window.location.href = '/admin/dashboard.html';
      } else {
        errorEl.textContent = data.error || 'Login failed. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch {
      errorEl.textContent = 'Network error. Is the server running?';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
