<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programs Manager — Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">🌿</div><div><div class="sidebar-logo-name">Stitch Malawi</div><div class="sidebar-logo-sub">Admin Panel</div></div></div></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Overview</div>
      <a href="/admin/dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <div class="sidebar-section-label">Content</div>
      <a href="/admin/gallery.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Gallery</a>
      <a href="/admin/posts.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>News & Events</a>
      <a href="/admin/programs.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Programs</a>
      <a href="/admin/team.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Team</a>
      <div class="sidebar-section-label">Communication</div>
      <a href="/admin/messages.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Messages<span class="badge" id="unread-badge" style="display:none">0</span></a>
      <div class="sidebar-section-label">Configuration</div>
      <a href="/admin/settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2m0 18v-2m10-8h-2M4 12H2"/></svg>Site Settings</a>
      <a href="/" class="sidebar-link" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View Public Site</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="sidebar-avatar" id="sidebar-avatar">A</div><div><div class="sidebar-username" id="sidebar-username">Admin</div><div class="sidebar-role">Administrator</div></div></div>
      <button id="logout-btn" class="btn-admin btn-ghost-admin" style="width:100%;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 class="topbar-title">Programs Manager</h1>
    </div>
    <div class="admin-content">
      <!-- Add/Edit Program Form -->
      <div class="admin-form-card">
        <h2 class="admin-form-title">Add / Edit Program</h2>
        <form id="program-form">
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-label" for="prog-title">Title *</label>
              <input class="admin-input" type="text" id="prog-title" placeholder="Program title..." required>
            </div>
            <div class="admin-form-group">
              <label class="admin-label" for="prog-icon">Icon</label>
              <select class="admin-input admin-select" id="prog-icon">
                <option value="graduation-cap">Education (Graduation Cap)</option>
                <option value="heart-pulse">Healthcare (Heart Pulse)</option>
                <option value="trending-up">Economic (Trending Up)</option>
                <option value="users">Women & Girls (Users)</option>
                <option value="droplets">Water & Sanitation (Droplets)</option>
                <option value="leaf">Environment (Leaf)</option>
                <option value="star">General (Star)</option>
              </select>
            </div>
          </div>
          <div class="admin-form-group">
            <label class="admin-label" for="prog-desc">Description</label>
            <textarea class="admin-textarea" id="prog-desc" placeholder="Detailed program description..."></textarea>
          </div>
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-label" for="prog-img-id">Cover Image ID (from Gallery)</label>
              <input class="admin-input" type="number" id="prog-img-id" placeholder="Gallery image ID (optional)">
            </div>
            <div class="admin-form-group">
              <label class="admin-label" for="prog-order">Display Order</label>
              <input class="admin-input" type="number" id="prog-order" value="0" min="0">
            </div>
          </div>
          <div style="display:flex;gap:12px">
            <button type="submit" class="btn-admin btn-primary-admin">Save Program</button>
            <button type="button" class="btn-admin btn-ghost-admin" onclick="document.getElementById('program-form').reset();document.getElementById('program-form').removeAttribute('data-edit-id')">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Programs Table -->
      <div class="admin-table-wrap">
        <div class="admin-table-header">
          <span class="admin-table-title">All Programs</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Icon</th>
              <th>Status</th>
              <th style="width:80px">Actions</th>
            </tr>
          </thead>
          <tbody id="programs-tbody">
            <tr><td colspan="5" style="text-align:center;padding:40px;color:var(--admin-text-muted)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/admin/js/admin.js"></script>
<script>initSidebar(); loadUnreadCount(); initProgramsAdmin();</script>
</body>
</html>
