<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Work & Programmes — Blessed Foundation Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="topbar-title">Our Work & Programmes</h1>
        <p style="font-size:0.85rem;color:var(--admin-text-muted)">Manage core foundation focus areas and programmes</p>
      </div>
      <div class="topbar-actions">
        <button class="btn-admin btn-primary-admin" onclick="openModal('program-modal')">
          + Add New Programme
        </button>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:60px">Code</th>
              <th>Programme Name</th>
              <th>Short Description</th>
              <th>Status</th>
              <th>Order</th>
              <th style="width:100px">Actions</th>
            </tr>
          </thead>
          <tbody id="programs-tbody">
            <tr><td colspan="6" style="text-align:center;color:var(--admin-text-muted);padding:40px">Loading programmes…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Programme Modal -->
<div id="program-modal" class="modal-overlay">
  <div class="modal-body">
    <div class="modal-header">
      <h3 style="font-size:1.1rem;font-weight:700" id="prog-modal-title">New Programme</h3>
      <button class="btn-admin btn-ghost-admin" onclick="closeModal('program-modal')">✕</button>
    </div>

    <form id="program-form">
      <input type="hidden" id="prog-id">
      <div class="admin-form-group">
        <label class="admin-label" for="prog-title">Programme Name</label>
        <input class="admin-input" type="text" id="prog-title" placeholder="e.g. Education" required>
      </div>

      <div class="admin-form-group">
        <label class="admin-label" for="prog-code">Number Code</label>
        <input class="admin-input" type="text" id="prog-code" placeholder="e.g. 01">
      </div>

      <div class="admin-form-group">
        <label class="admin-label" for="prog-desc">Short Description</label>
        <textarea class="admin-textarea" id="prog-desc" placeholder="Supporting children and young people through learning opportunities..."></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="admin-form-group">
          <label class="admin-label" for="prog-status">Status</label>
          <select class="admin-select" id="prog-status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="paused">Paused</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <div class="admin-form-group">
          <label class="admin-label" for="prog-order">Display Order</label>
          <input class="admin-input" type="number" id="prog-order" value="1">
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:10px">
        <button type="button" class="btn-admin btn-ghost-admin" onclick="closeModal('program-modal')">Cancel</button>
        <button type="submit" class="btn-admin btn-primary-admin">Save Programme</button>
      </div>
    </form>
  </div>
</div>

<script src="/admin/js/admin.js"></script>
<script>
  initSidebar();
  loadUnreadCount();

  let programs = [];

  async function loadPrograms() {
    try {
      const res = await authFetch('/api/programs/all');
      programs = await res.json();
      renderPrograms();
    } catch {
      document.getElementById('programs-tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--admin-red)">Failed to load programmes.</td></tr>';
    }
  }

  function renderPrograms() {
    const tbody = document.getElementById('programs-tbody');
    if (!programs.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--admin-text-muted);padding:40px">No programmes created yet.</td></tr>';
      return;
    }
    tbody.innerHTML = programs.map(p => `
      <tr>
        <td><strong style="color:var(--admin-green-light)">${p.code || '01'}</strong></td>
        <td><div style="font-weight:700">${p.title}</div></td>
        <td style="color:var(--admin-text-muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description || '—'}</td>
        <td><span class="badge-status ${p.status || 'active'}">${p.status || 'Active'}</span></td>
        <td>${p.display_order || 1}</td>
        <td>
          <div style="display:flex;gap:6px">
            <button class="btn-admin btn-icon-admin btn-ghost-admin" onclick="editProgram(${p.id})">✏️</button>
            <button class="btn-admin btn-icon-admin btn-danger-admin" onclick="deleteProgram(${p.id})">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function editProgram(id) {
    const p = programs.find(x => x.id === id);
    if (!p) return;
    document.getElementById('prog-id').value = p.id;
    document.getElementById('prog-title').value = p.title;
    document.getElementById('prog-code').value = p.code || '';
    document.getElementById('prog-desc').value = p.description || '';
    document.getElementById('prog-status').value = p.status || 'active';
    document.getElementById('prog-order').value = p.display_order || 1;
    document.getElementById('prog-modal-title').textContent = 'Edit Programme';
    openModal('program-modal');
  }

  document.getElementById('program-form').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('prog-id').value;
    const body = {
      title: document.getElementById('prog-title').value,
      code: document.getElementById('prog-code').value,
      description: document.getElementById('prog-desc').value,
      status: document.getElementById('prog-status').value,
      display_order: parseInt(document.getElementById('prog-order').value) || 1,
    };
    try {
      const url = id ? `/api/programs/${id}` : '/api/programs';
      const method = id ? 'PATCH' : 'POST';
      const res = await authFetch(url, { method, body: JSON.stringify(body) });
      if (res?.ok) {
        adminToast('Programme saved!');
        closeModal('program-modal');
        e.target.reset();
        loadPrograms();
      }
    } catch { adminToast('Error saving programme', 'error'); }
  });

  async function deleteProgram(id) {
    if (!confirm('Delete this programme?')) return;
    try {
      const res = await authFetch(`/api/programs/${id}`, { method: 'DELETE' });
      if (res?.ok) { adminToast('Programme deleted'); loadPrograms(); }
    } catch { adminToast('Delete failed', 'error'); }
  }

  loadPrograms();
</script>
</body>
</html>
