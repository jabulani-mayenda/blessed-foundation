<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories & Articles — Blessed Foundation Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="topbar-title">Stories & Articles</h1>
        <p style="font-size:0.85rem;color:var(--admin-text-muted)">Manage community stories, news, and published articles</p>
      </div>
      <div class="topbar-actions">
        <a href="/admin/story-editor.html" class="btn-admin btn-primary-admin">
          + New Story
        </a>
      </div>
    </div>

    <div class="admin-content">
      <div style="display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <input type="text" id="story-search" class="admin-input" placeholder="Search by title, category, or author…">
        </div>
        <div style="width:160px">
          <select id="story-category" class="admin-select">
            <option value="">All Categories</option>
            <option value="Education">Education</option>
            <option value="Community">Community</option>
            <option value="Youth">Youth</option>
            <option value="Families">Families</option>
          </select>
        </div>
        <div style="width:140px">
          <select id="story-status" class="admin-select">
            <option value="">All Statuses</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="scheduled">Scheduled</option>
          </select>
        </div>
      </div>

      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:60px">Cover</th>
              <th>Story Title</th>
              <th>Category</th>
              <th>Author</th>
              <th>Status</th>
              <th>Date</th>
              <th style="width:120px">Actions</th>
            </tr>
          </thead>
          <tbody id="stories-tbody">
            <tr><td colspan="7" style="text-align:center;color:var(--admin-text-muted);padding:40px">Loading stories…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/admin.js"></script>
<script>
  initSidebar();
  loadUnreadCount();

  let allStories = [];

  async function loadStories() {
    try {
      const res = await authFetch('/api/posts?published_only=false');
      allStories = await res.json();
      renderStories(allStories);
    } catch {
      document.getElementById('stories-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--admin-red)">Failed to load stories.</td></tr>';
    }
  }

  function renderStories(stories) {
    const tbody = document.getElementById('stories-tbody');
    if (!stories.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--admin-text-muted);padding:40px">No stories found. Use the "+ New Story" button to write one.</td></tr>';
      return;
    }
    tbody.innerHTML = stories.map(s => `
      <tr>
        <td>
          ${s.cover_url ? `<img class="table-img" src="${s.cover_url}" alt="">` : '<div class="table-img-placeholder" style="font-size:1.2rem">📖</div>'}
        </td>
        <td>
          <div style="font-weight:700">${s.title}</div>
          <div style="font-size:0.75rem;color:var(--admin-text-muted)">/stories?slug=${s.slug}</div>
        </td>
        <td><span class="badge-status" style="background:rgba(255,255,255,0.06);color:var(--admin-text)">${s.category || 'General'}</span></td>
        <td>${s.author || 'Blessed Foundation'}</td>
        <td><span class="badge-status ${s.status || (s.is_published ? 'published' : 'draft')}">${s.status || (s.is_published ? 'Published' : 'Draft')}</span></td>
        <td>${fmtDate(s.created_at)}</td>
        <td>
          <div style="display:flex;gap:6px">
            <a href="/admin/story-editor.html?id=${s.id}" class="btn-admin btn-icon-admin btn-ghost-admin" title="Edit Story">✏️</a>
            <button class="btn-admin btn-icon-admin btn-danger-admin" onclick="deleteStory(${s.id})" title="Delete Story">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function deleteStory(id) {
    if (!confirm('Are you sure you want to delete this story? It will be moved to the trash bin.')) return;
    try {
      const res = await authFetch(`/api/posts/${id}`, { method: 'DELETE' });
      if (res?.ok) {
        adminToast('Story moved to trash');
        loadStories();
      }
    } catch { adminToast('Delete failed', 'error'); }
  }

  // Filter listeners
  document.getElementById('story-search').addEventListener('input', e => {
    const term = e.target.value.toLowerCase();
    renderStories(allStories.filter(s => s.title.toLowerCase().includes(term) || (s.category || '').toLowerCase().includes(term)));
  });

  document.getElementById('story-category').addEventListener('change', e => {
    const cat = e.target.value;
    renderStories(cat ? allStories.filter(s => s.category === cat) : allStories);
  });

  document.getElementById('story-status').addEventListener('change', e => {
    const st = e.target.value;
    renderStories(st ? allStories.filter(s => (s.status || (s.is_published ? 'published' : 'draft')) === st) : allStories);
  });

  loadStories();
</script>
</body>
</html>
